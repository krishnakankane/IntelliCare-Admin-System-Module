version: "3.9"

# =============================================
# IntelliCare — Local Development Stack
# =============================================
services:

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: intellicare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellicaredb
      POSTGRES_USER: intellicare
      POSTGRES_PASSWORD: intellicare_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellicare -d intellicaredb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== IntelliCare Backend (production-mode) =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellicare-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: intellicaredb
      DB_USERNAME: intellicare
      DB_PASSWORD: intellicare_dev_pass
      JWT_SECRET: ChangeThisSecretKeyInProductionItMustBeAtLeast64CharactersLongForHS512!!
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: noreply@intellicare.com
      MAIL_PASSWORD: ""
      MAIL_FROM: noreply@intellicare.com
      AI_MOCK_ENABLED: "true"
      TWILIO_MOCK_ENABLED: "true"
      WHATSAPP_MOCK_ENABLED: "true"
      OPENAI_API_KEY: "mock-key"
      ELEVENLABS_API_KEY: "mock-key"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== MailHog (local email testing) =====
  mailhog:
    image: mailhog/mailhog:latest
    container_name: intellicare-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ===== pgAdmin (optional DB GUI) =====
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: intellicare-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@intellicare.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_pass
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    name: intellicare_postgres_data
