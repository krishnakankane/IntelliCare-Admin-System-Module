# =============================================
# IntelliCare Backend — Base Configuration
# =============================================

spring.application.name=intellicare-backend

# Active profile (overridden by env var SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# SERVER
# =============================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.error.include-message=on_param
server.error.include-binding-errors=on_param

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =============================================
# JWT
# =============================================
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForIntelliCareJWTThatShouldBeReplacedInProduction2024!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# =============================================
# MAIL
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@intellicare.com}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@intellicare.com}

# =============================================
# AI — OPENAI / LANGCHAIN4J
# =============================================
app.ai.openai.api-key=${OPENAI_API_KEY:mock-key-replace-in-production}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o}
app.ai.openai.temperature=${OPENAI_TEMPERATURE:0.7}
app.ai.openai.max-tokens=${OPENAI_MAX_TOKENS:2048}
app.ai.whisper.model=${WHISPER_MODEL:whisper-1}
app.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:mock-key-replace-in-production}
app.ai.elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:21m00Tcm4TlvDq8ikWAM}
app.ai.mock-enabled=${AI_MOCK_ENABLED:true}

# =============================================
# TWILIO — SMS
# =============================================
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:mock-sid}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:mock-token}
app.twilio.from-number=${TWILIO_FROM_NUMBER:+15005550006}
app.twilio.mock-enabled=${TWILIO_MOCK_ENABLED:true}

# =============================================
# WHATSAPP
# =============================================
app.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:mock-token}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:mock-id}
app.whatsapp.mock-enabled=${WHATSAPP_MOCK_ENABLED:true}

# =============================================
# ACTUATOR / MONITORING
# =============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=IntelliCare Backend
info.app.version=1.0.0

# =============================================
# SPRINGDOC / SWAGGER
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =============================================
# LOGGING
# =============================================
logging.level.com.intellicare=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
