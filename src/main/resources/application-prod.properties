# =============================================
# IntelliCare — Production Profile (PostgreSQL)
# =============================================

# =============================================
# DATABASE — PostgreSQL
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intellicaredb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=IntelliCareHikariPool

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intellicaredb}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}

# =============================================
# LOGGING — production
# =============================================
logging.level.com.intellicare=INFO
logging.level.org.springframework.security=WARN
logging.file.name=/var/log/intellicare/application.log
logging.file.max-size=50MB
logging.file.max-history=30

# =============================================
# SECURITY
# =============================================
# Swagger disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# =============================================
# ACTUATOR — restricted in prod
# =============================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# =============================================
# AI — real integrations
# =============================================
app.ai.mock-enabled=false
app.twilio.mock-enabled=false
app.whatsapp.mock-enabled=false
