# =============================================
# IntelliCare — Development Profile (H2)
# =============================================

# =============================================
# DATABASE — H2
# =============================================
spring.datasource.url=jdbc:h2:mem:intellicaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway — inherit datasource url; disable PostgreSQL-specific validation
spring.flyway.baseline-on-migrate=true

# =============================================
# LOGGING — verbose for dev
# =============================================
logging.level.com.intellicare=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.security=DEBUG

# =============================================
# AI — mock mode on by default
# =============================================
app.ai.mock-enabled=true
app.twilio.mock-enabled=true
app.whatsapp.mock-enabled=true
