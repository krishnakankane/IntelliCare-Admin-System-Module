version: "3.9"

# =============================================
# IntelliCare — Production Compose
# Uses pre-built image from GHCR
# All secrets via environment / .env file
# =============================================
services:

  postgres:
    image: postgres:16-alpine
    container_name: intellicare-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intellicare-net

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/intellicare-backend:latest
    container_name: intellicare-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/var/log/intellicare
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - intellicare-net

volumes:
  postgres_prod_data:
  app_logs:

networks:
  intellicare-net:
    driver: bridge
